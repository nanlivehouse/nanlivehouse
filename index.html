<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南方酒館｜演出班表</title>
<meta name="description" content="南方酒館現場演出班表,點歌手名字看他們在台上的精彩片段。">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="marquee">
  <div class="kicker">Live House · Since Night</div>
  <h1>南方酒館</h1>
  <div class="sub" id="month-sub">演出班表</div>
</header>

<main class="wrap">

  <div class="weekday-row">
    <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
  </div>

  <div class="cal-grid" id="cal-grid"></div>

  <h2 class="section-title">本月歌手</h2>
  <div class="act-grid" id="act-grid"></div>

  <footer>
    點歌手名字看他們在南方酒館演出的精彩片段 · 訂位前先認識今晚駐唱歌手<br>
    <a href="https://www.instagram.com/nanlivehouse/" target="_blank" rel="noopener">@nanlivehouse</a>
  </footer>

</main>

<script src="data.js"></script>
<script>
  document.getElementById('month-sub').textContent = MONTH_SUBLABEL + ' · ' + MONTH_LABEL;
  document.title = '南方酒館｜' + MONTH_LABEL + ' 演出班表';

  const calGrid = document.getElementById('cal-grid');

  // 補前面的空格,讓 1 號對齊到正確星期
  for (let i = 0; i < FIRST_WEEKDAY; i++) {
    const empty = document.createElement('div');
    empty.className = 'day-card empty';
    calGrid.appendChild(empty);
  }

  const appearedActs = new Set();

  for (let day = 1; day <= DAYS_IN_MONTH; day++) {
    const info = SCHEDULE[day] || { sets: [] };
    const card = document.createElement('div');
    card.className = 'day-card';
    if (info.closed) card.classList.add('closed');
    if (info.private) card.classList.add('private');

    let html = `<span class="date-num">${day}</span>`;
    if (info.closed) html += `<span class="tag closed-tag">公休</span>`;
    if (info.private) html += `<span class="tag private-tag">包場</span>`;

    if (!info.closed) {
      html += `<hr class="perf">`;
      if (info.sets && info.sets.length) {
        html += `<ul class="lineup">`;
        info.sets.forEach(s => {
          const act = ACTS[s.a];
          if (!act) return;
          appearedActs.add(s.a);
          html += `<li><a href="act.html?id=${encodeURIComponent(s.a)}"><span class="time">${s.t}</span>${act.name}</a></li>`;
        });
        html += `</ul>`;
      } else if (info.private) {
        html += `<div style="font-size:11px;color:var(--muted)">不開放一般訂位</div>`;
      }
    }

    card.innerHTML = html;
    calGrid.appendChild(card);
  }

  // 本月歌手總覽(依 ACTS 定義順序,只列有出場的)
  const actGrid = document.getElementById('act-grid');
  Object.keys(ACTS).forEach(id => {
    if (!appearedActs.has(id)) return;
    const a = document.createElement('a');
    a.className = 'act-chip';
    a.href = `act.html?id=${encodeURIComponent(id)}`;
    a.textContent = ACTS[id].name;
    actGrid.appendChild(a);
  });
</script>

</body>
</html>
